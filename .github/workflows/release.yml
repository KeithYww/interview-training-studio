name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*' # Trigger only on version tags like v1.0.0

permissions:
  contents: write # required for creating releases & uploading assets

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: build:win
            build_args: --publish never
            artifact: windows
            artifact_glob: dist/*setup.exe
          - os: macos-15-intel
            command: build:mac
            build_args: --x64 --publish never
            artifact: macos-intel
            artifact_glob: dist/*-x64.dmg
          - os: macos-15
            command: build:mac
            build_args: --arm64 --publish never
            artifact: macos-apple-silicon
            artifact_glob: dist/*-arm64.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Package Electron app
        run: npm run ${{ matrix.command }} -- ${{ matrix.build_args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-build-${{ matrix.artifact }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          dmg_x64="$(find dist -type f -name '*-x64.dmg' | head -1)"
          dmg_arm64="$(find dist -type f -name '*-arm64.dmg' | head -1)"
          exe="$(find dist -type f -name '*setup.exe' | head -1)"
          test -f "$dmg_x64"
          test -f "$dmg_arm64"
          test -f "$exe"
          cp "$dmg_x64" dist/offerGet-mac-x64.dmg
          cp "$dmg_arm64" dist/offerGet-mac-arm64.dmg
          cp "$exe" dist/offerGet-windows.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            dist/electron-build-macos-intel/*.dmg
            dist/electron-build-macos-apple-silicon/*.dmg
            dist/electron-build-windows/*setup.exe
            dist/offerGet-mac-x64.dmg
            dist/offerGet-mac-arm64.dmg
            dist/offerGet-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure China deployment SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CHINA_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CHINA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/offerget_deploy
          chmod 600 ~/.ssh/offerget_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish installers to China download service
        env:
          SSH_HOST: ${{ secrets.CHINA_SSH_HOST }}
          SSH_USER: ${{ secrets.CHINA_SSH_USER }}
        run: |
          set -euo pipefail
          dmg_x64="$(find dist -type f -name '*-x64.dmg' | head -1)"
          dmg_arm64="$(find dist -type f -name '*-arm64.dmg' | head -1)"
          exe="$(find dist -type f -name '*setup.exe' | head -1)"
          test -f "$dmg_x64"
          test -f "$dmg_arm64"
          test -f "$exe"
          ssh_opts=(-i ~/.ssh/offerget_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" "$dmg_x64" "$SSH_USER@$SSH_HOST:/tmp/offerGet-mac-x64.dmg"
          scp "${ssh_opts[@]}" "$dmg_arm64" "$SSH_USER@$SSH_HOST:/tmp/offerGet-mac-arm64.dmg"
          scp "${ssh_opts[@]}" "$exe" "$SSH_USER@$SSH_HOST:/tmp/offerGet-windows.exe"
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            'sudo install -m 644 /tmp/offerGet-mac-x64.dmg /opt/offerget/shared/downloads/offerGet-mac-x64.dmg &&
             sudo install -m 644 /tmp/offerGet-mac-x64.dmg /opt/offerget/shared/downloads/offerGet-mac.dmg &&
             sudo install -m 644 /tmp/offerGet-mac-arm64.dmg /opt/offerget/shared/downloads/offerGet-mac-arm64.dmg &&
             sudo install -m 644 /tmp/offerGet-windows.exe /opt/offerget/shared/downloads/offerGet-windows.exe &&
             rm -f /tmp/offerGet-mac-x64.dmg /tmp/offerGet-mac-arm64.dmg /tmp/offerGet-windows.exe'
