name: Sync Release Downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.8.15
        required: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve signed release asset URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          resolve_asset() {
            local name="$1"
            local prefix="$2"
            local api_url digest size signed_url
            api_url="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .url' <<<"$release_json")"
            digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            size="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' <<<"$release_json")"
            test -n "$api_url"
            test "$api_url" != null
            test "$digest" != null
            test "$size" != null
            signed_url="$(
              curl -sS --max-redirs 0 -o /dev/null -D - \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/octet-stream' \
                "$api_url" |
                awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, "", $2); print $2 }'
            )"
            test -n "$signed_url"
            {
              printf '%s_URL<<SIGNED_URL\n%s\nSIGNED_URL\n' "$prefix" "$signed_url"
              printf '%s_SHA=%s\n' "$prefix" "${digest#sha256:}"
              printf '%s_SIZE=%s\n' "$prefix" "$size"
            } >> "$GITHUB_ENV"
          }
          resolve_asset offerGet-mac-x64.dmg MAC_X64
          resolve_asset offerGet-mac-arm64.dmg MAC_ARM64
          resolve_asset offerGet-windows.exe WINDOWS

      - name: Configure China deployment SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CHINA_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CHINA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/offerget_deploy
          chmod 600 ~/.ssh/offerget_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish and verify installers
        env:
          SSH_HOST: ${{ secrets.CHINA_SSH_HOST }}
          SSH_USER: ${{ secrets.CHINA_SSH_USER }}
          MAC_X64_URL: ${{ env.MAC_X64_URL }}
          MAC_X64_SHA: ${{ env.MAC_X64_SHA }}
          MAC_X64_SIZE: ${{ env.MAC_X64_SIZE }}
          MAC_ARM64_URL: ${{ env.MAC_ARM64_URL }}
          MAC_ARM64_SHA: ${{ env.MAC_ARM64_SHA }}
          MAC_ARM64_SIZE: ${{ env.MAC_ARM64_SIZE }}
          WINDOWS_URL: ${{ env.WINDOWS_URL }}
          WINDOWS_SHA: ${{ env.WINDOWS_SHA }}
          WINDOWS_SIZE: ${{ env.WINDOWS_SIZE }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i ~/.ssh/offerget_deploy
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          payload="$(
            printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
              "$MAC_X64_URL" "$MAC_X64_SHA" "$MAC_X64_SIZE" \
              "$MAC_ARM64_URL" "$MAC_ARM64_SHA" "$MAC_ARM64_SIZE" \
              "$WINDOWS_URL" "$WINDOWS_SHA" "$WINDOWS_SIZE" |
              base64 -w 0
          )"
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$payload" <<'REMOTE_SCRIPT'
          set -euo pipefail
          mapfile -t release_values < <(printf '%s' "$1" | base64 -d)
          mac_x64_url="${release_values[0]}"
          mac_x64_sha="${release_values[1]}"
          mac_x64_size="${release_values[2]}"
          mac_arm64_url="${release_values[3]}"
          mac_arm64_sha="${release_values[4]}"
          mac_arm64_size="${release_values[5]}"
          windows_url="${release_values[6]}"
          windows_sha="${release_values[7]}"
          windows_size="${release_values[8]}"
          cd /tmp
          curl_opts=(
            --fail
            --location
            --retry 5
            --retry-all-errors
            --connect-timeout 20
            --speed-limit 1024
            --speed-time 60
          )
          download_release_asset() {
            local url="$1"
            local expected_sha="$2"
            local expected_size="$3"
            local file="$4"
            local current_size=0
            local remaining chunk_size parts_dir combined
            if [[ -f "$file" ]]; then
              current_size="$(stat -c %s "$file")"
            fi
            if [[ "$current_size" == "$expected_size" ]]; then
              if printf '%s  %s\n' "$expected_sha" "$file" | sha256sum -c -; then
                printf '%s is already complete (%s bytes)\n' "$file" "$expected_size"
                return
              fi
              rm -f "$file"
              current_size=0
            fi
            if (( current_size > expected_size )); then
              rm -f "$file"
              current_size=0
            fi
            remaining=$((expected_size - current_size))
            chunk_size=$(((remaining + 7) / 8))
            parts_dir="${file}.parts"
            mkdir -p "$parts_dir"
            pids=()
            part_files=()
            for ((index = 0; index < 8; index++)); do
              start=$((current_size + index * chunk_size))
              ((start >= expected_size)) && break
              end=$((start + chunk_size - 1))
              ((end >= expected_size)) && end=$((expected_size - 1))
              part="$parts_dir/$(printf '%02d' "$index")-$start-$end"
              part_files+=("$part")
              expected_part_size=$((end - start + 1))
              if [[ -f "$part" ]] && [[ "$(stat -c %s "$part")" == "$expected_part_size" ]]; then
                continue
              fi
              rm -f "$part"
              curl "${curl_opts[@]}" --range "$start-$end" -o "$part" "$url" &
              pids+=("$!")
            done
            for pid in "${pids[@]}"; do
              wait "$pid"
            done
            combined="${file}.combined"
            rm -f "$combined"
            if [[ -f "$file" ]]; then
              cp "$file" "$combined"
            else
              : > "$combined"
            fi
            for part in "${part_files[@]}"; do
              range="${part##*/}"
              range="${range#*-}"
              start="${range%-*}"
              end="${range#*-}"
              test "$(stat -c %s "$part")" = "$((end - start + 1))"
              cat "$part" >> "$combined"
            done
            mv "$combined" "$file"
            rm -rf "$parts_dir"
            test "$(stat -c %s "$file")" = "$expected_size"
            printf '%s  %s\n' "$expected_sha" "$file" | sha256sum -c -
          }
          download_release_asset \
            "$mac_x64_url" "$mac_x64_sha" "$mac_x64_size" offerGet-mac-x64.dmg
          download_release_asset \
            "$mac_arm64_url" "$mac_arm64_sha" "$mac_arm64_size" offerGet-mac-arm64.dmg
          download_release_asset \
            "$windows_url" "$windows_sha" "$windows_size" offerGet-windows.exe
          printf '%s  %s\n' \
            "$mac_x64_sha" offerGet-mac-x64.dmg \
            "$mac_arm64_sha" offerGet-mac-arm64.dmg \
            "$windows_sha" offerGet-windows.exe |
            sha256sum -c -
          sudo install -m 644 offerGet-mac-x64.dmg /opt/offerget/shared/downloads/offerGet-mac-x64.dmg
          sudo install -m 644 offerGet-mac-x64.dmg /opt/offerget/shared/downloads/offerGet-mac.dmg
          sudo install -m 644 offerGet-mac-arm64.dmg /opt/offerget/shared/downloads/offerGet-mac-arm64.dmg
          sudo install -m 644 offerGet-windows.exe /opt/offerget/shared/downloads/offerGet-windows.exe
          rm -f offerGet-mac-x64.dmg offerGet-mac-arm64.dmg offerGet-windows.exe
          REMOTE_SCRIPT
