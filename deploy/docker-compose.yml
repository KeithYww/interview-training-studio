services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    image: offerget-backend:${BUILD_SHA:-development}
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      APP_VERSION: ${BUILD_SHA:-development}
      APP_SECRET: ${APP_SECRET}
      ACTIVATION_ADMIN_SECRET: ${ACTIVATION_ADMIN_SECRET:-}
      ADMIN_CONSOLE_PASSWORD: ${ADMIN_CONSOLE_PASSWORD:-}
      DEV_EMAIL_CODES: 'false'
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_ASR_MODEL: ${DASHSCOPE_ASR_MODEL:-fun-asr-realtime}
      DASHSCOPE_ASR_WS_URL: ${DASHSCOPE_ASR_WS_URL:-wss://dashscope.aliyuncs.com/api-ws/v1/inference}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_VISION_MODEL: ${SILICONFLOW_VISION_MODEL:-Qwen/Qwen3-VL-32B-Instruct}
      SILICONFLOW_IMAGE_DETAIL: ${SILICONFLOW_IMAGE_DETAIL:-high}
      SILICONFLOW_VISION_TIMEOUT_MS: ${SILICONFLOW_VISION_TIMEOUT_MS:-90000}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web:
    image: offerget-web:${BUILD_SHA:-development}
    build:
      context: ..
      dockerfile: website/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    depends_on:
      - backend
    ports:
      - '8080:80'
      - '8443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${CERTBOT_DIR:-/opt/joblens/certbot}:/etc/letsencrypt:ro
      - ${DOWNLOADS_DIR:-/opt/offerget/shared/downloads}:/downloads/downloads:ro
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
